<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Season Tower · top-5 EU leagues</title>
  <!-- favicon: a mini league-standings staircase (points-won bars, descending) on the app's dark chip -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315181d'/%3E%3Crect x='4.5' y='7' width='4.5' height='20' rx='1.3' fill='%230B8A3D'/%3E%3Crect x='10.75' y='11' width='4.5' height='16' rx='1.3' fill='%2312A0D7'/%3E%3Crect x='17' y='15' width='4.5' height='12' rx='1.3' fill='%23E4022B'/%3E%3Crect x='23.25' y='19' width='4.5' height='8' rx='1.3' fill='%23F4C400'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;}
    #root{height:100%;}
    body{font-family:'Archivo',system-ui,sans-serif;background:#F5F6F4;color:#15181d;-webkit-font-smoothing:antialiased;}
    a{color:#0B8A3D;text-decoration:none;} a:hover{color:#08702f;}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    input[type=number]{-moz-appearance:textfield;}
    button{font-family:inherit;}
    ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:#D3D6DB;border-radius:8px;}
    /* scrubber whose thumb is a big dot (holds the matchday number, overlaid in JSX) */
    input.mdslider{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0;}
    input.mdslider::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:#DADDE2;}
    input.mdslider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#0B8A3D;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);margin-top:-9.5px;}
    input.mdslider::-moz-range-track{height:5px;border-radius:5px;background:#DADDE2;}
    input.mdslider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#0B8A3D;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
