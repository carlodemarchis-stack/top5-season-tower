<!doctype html><html><head><meta charset="utf-8"><title>Rivals mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f5f6f4;font-family:Archivo,system-ui,sans-serif;color:#15181d}
.row{display:flex;gap:40px;padding:20px 30px}.box{width:520px}h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6a717b;margin:0 0 6px}
svg{display:block;width:520px;height:520px}text{font-family:Archivo}
.leg{font-size:11px;color:#6a717b;display:flex;gap:12px;margin-top:4px}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}</style></head><body>
<div class="row"><div class="box"><h2>A — crest at its place, lines to each opponent</h2><svg id="a" viewBox="0 0 520 520"></svg></div>
<div class="box"><h2>B — crest in the centre</h2><svg id="b" viewBox="0 0 520 520"></svg></div></div>
<div class="leg" style="padding:0 30px"><span><i style="background:#2f9e58"></i>won</span><span><i style="background:#EAB308"></i>drew</span><span><i style="background:#dc5c5e"></i>lost</span><span><i style="background:#d9dde1"></i>to play</span><span>· each circle: the two meetings — left half at home, right half away · score inside</span></div>
<script>
const D = {"code":"TOR","name":"Torino","color":"#6E1423","table":[{"code":"INT","name":"Inter","pos":1,"pts":19,"color":"#0B4DA2"},{"code":"LAZ","name":"Lazio","pos":2,"pts":19,"color":"#4FA9D6"},{"code":"ROM","name":"Roma","pos":3,"pts":17,"color":"#8E1F2F"},{"code":"MIL","name":"Milan","pos":4,"pts":15,"color":"#E4022B"},{"code":"COM","name":"Como","pos":5,"pts":14,"color":"#0E63B3"},{"code":"FRO","name":"Frosinone","pos":6,"pts":13,"color":"#2D5FAA"},{"code":"CAG","name":"Cagliari","pos":7,"pts":13,"color":"#A31D2A"},{"code":"JUV","name":"Juventus","pos":8,"pts":11,"color":"#141414"},{"code":"NAP","name":"Napoli","pos":9,"pts":10,"color":"#12A0D7"},{"code":"TOR","name":"Torino","pos":10,"pts":10,"color":"#6E1423"},{"code":"ATA","name":"Atalanta","pos":11,"pts":9,"color":"#2472B6"},{"code":"LEC","name":"Lecce","pos":12,"pts":9,"color":"#E01A22"},{"code":"SAS","name":"Sassuolo","pos":13,"pts":8,"color":"#00A752"},{"code":"MON","name":"Monza","pos":14,"pts":7,"color":"#8F0A1E"},{"code":"BOL","name":"Bologna","pos":15,"pts":5,"color":"#9E1B32"},{"code":"UDI","name":"Udinese","pos":16,"pts":4,"color":"#3A3A3A"},{"code":"GEN","name":"Genoa","pos":17,"pts":4,"color":"#B4192A"},{"code":"FIO","name":"Fiorentina","pos":18,"pts":4,"color":"#5A2D91"},{"code":"PAR","name":"Parma","pos":19,"pts":4,"color":"#F4C400"},{"code":"VEN","name":"Venezia","pos":20,"pts":3,"color":"#0E7A4D"}],"games":[{"w":1,"opp":"MIL","ha":"H","gf":1,"ga":2},{"w":2,"opp":"SAS","ha":"A","gf":1,"ga":2},{"w":3,"opp":"FIO","ha":"A","gf":2,"ga":1},{"w":4,"opp":"ROM","ha":"H","gf":0,"ga":2},{"w":5,"opp":"BOL","ha":"A","gf":1,"ga":1},{"w":6,"opp":"UDI","ha":"H","gf":2,"ga":1},{"w":7,"opp":"PAR","ha":"A","gf":3,"ga":0},{"w":8,"opp":"MON","ha":"H"},{"w":9,"opp":"COM","ha":"H"},{"w":10,"opp":"FRO","ha":"A"},{"w":11,"opp":"LEC","ha":"H"},{"w":12,"opp":"NAP","ha":"A"},{"w":13,"opp":"LAZ","ha":"H"},{"w":14,"opp":"GEN","ha":"A"},{"w":15,"opp":"INT","ha":"A"},{"w":16,"opp":"CAG","ha":"H"},{"w":17,"opp":"VEN","ha":"H"},{"w":18,"opp":"JUV","ha":"A"},{"w":19,"opp":"ATA","ha":"H"},{"w":20,"opp":"MIL","ha":"A"},{"w":21,"opp":"LEC","ha":"A"},{"w":22,"opp":"FRO","ha":"H"},{"w":23,"opp":"ROM","ha":"A"},{"w":24,"opp":"SAS","ha":"H"},{"w":25,"opp":"COM","ha":"A"},{"w":26,"opp":"FIO","ha":"H"},{"w":27,"opp":"ATA","ha":"A"},{"w":28,"opp":"INT","ha":"H"},{"w":29,"opp":"UDI","ha":"A"},{"w":30,"opp":"JUV","ha":"H"},{"w":31,"opp":"LAZ","ha":"A"},{"w":32,"opp":"GEN","ha":"H"},{"w":33,"opp":"VEN","ha":"A"},{"w":34,"opp":"PAR","ha":"H"},{"w":35,"opp":"BOL","ha":"H"},{"w":36,"opp":"CAG","ha":"A"},{"w":37,"opp":"NAP","ha":"H"},{"w":38,"opp":"MON","ha":"A"}]}, ME = D.code, RES = (gf, ga) => gf == null ? '#d9dde1' : gf > ga ? '#2f9e58' : gf < ga ? '#dc5c5e' : '#EAB308'
const by = {}; for (const g of D.games) (by[g.opp] ||= {})[g.ha] = g
const logo = c => `../public/logos/${c}.png`
function draw(id, centre) {
  const sv = document.getElementById(id), C = 260, R = centre ? 180 : 190, N = D.table.length
  const slots = D.table.filter(t => centre ? t.code !== ME : true)
  const pos = (i, n) => { const a = -Math.PI / 2 + i / n * 2 * Math.PI; return [C + R * Math.cos(a), C + R * Math.sin(a)] }
  let lines = '', nodes = ''
  const me = centre ? [C, C] : pos(D.table.findIndex(t => t.code === ME), N)
  slots.forEach((t, i) => {
    const [x, y] = pos(i, slots.length)
    if (t.code === ME) { nodes += `<circle cx="${x}" cy="${y}" r="30" fill="#fff" stroke="${D.color}" stroke-width="3"/><image href="${logo(ME)}" x="${x - 22}" y="${y - 22}" width="44" height="44"/>`; return }
    const h = by[t.code]?.H || {}, a = by[t.code]?.A || {}, r = 21
    // lines: one per played meeting, in the result colour
    // the link bows towards the middle (control point between the chord's midpoint and the centre): it never runs
    // under a neighbour's dot. Two meetings played: two arcs, a little apart
    const arc = (bend) => { const mx = (me[0] + x) / 2, my = (me[1] + y) / 2, k = centre ? 0 : bend; return `M${me[0]} ${me[1]}Q${mx + (C - mx) * k} ${my + (C - my) * k} ${x} ${y}` }
    const played = [h, a].filter(g => g.gf != null)
    played.forEach((g, j) => lines += `<path d="${arc(played.length > 1 ? (j ? .62 : .82) : .72)}" fill="none" stroke="${RES(g.gf, g.ga)}" stroke-width="1.8" opacity=".6"/>`)
    if (!played.length) lines += `<path d="${arc(.72)}" fill="none" stroke="#c9ced4" stroke-width=".8" stroke-dasharray="3 3" opacity=".6"/>`
    nodes += `<g><path d="M${x} ${y - r}A${r} ${r} 0 0 0 ${x} ${y + r}Z" fill="${RES(h.gf, h.ga)}"/><path d="M${x} ${y - r}A${r} ${r} 0 0 1 ${x} ${y + r}Z" fill="${RES(a.gf, a.ga)}"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#fff" stroke-width="2"/><line x1="${x}" x2="${x}" y1="${y - r}" y2="${y + r}" stroke="#fff" stroke-width="1.5"/>
      <text x="${x - r / 2}" y="${y + 4}" text-anchor="middle" font-size="10.5" font-weight="900" fill="${h.gf != null ? '#fff' : '#9aa0a8'}">${h.gf != null ? h.gf + '-' + h.ga : 'H'}</text>
      <text x="${x + r / 2}" y="${y + 4}" text-anchor="middle" font-size="10.5" font-weight="900" fill="${a.gf != null ? '#fff' : '#9aa0a8'}">${a.gf != null ? a.gf + '-' + a.ga : 'A'}</text>
      ${(() => { // crest then code, outside the dot along its radius (text anchored away from the centre)
        const a = -Math.PI / 2 + i / slots.length * 2 * Math.PI, cx = C + (R + r + 14) * Math.cos(a), cy = C + (R + r + 14) * Math.sin(a)
        const tx = C + (R + r + 30) * Math.cos(a), ty = C + (R + r + 30) * Math.sin(a), cos = Math.cos(a)
        const anchor = cos > .25 ? 'start' : cos < -.25 ? 'end' : 'middle', dy = Math.abs(cos) <= .25 ? (Math.sin(a) < 0 ? -2 : 9) : 3.5
        return `<image href="${logo(t.code)}" x="${cx - 9}" y="${cy - 9}" width="18" height="18"/><text x="${tx + (anchor === 'start' ? -4 : anchor === 'end' ? 4 : 0)}" y="${ty + dy}" text-anchor="${anchor}" font-size="10.5" font-weight="800" fill="#5b626c">${t.code}</text>` })()}</g>`
  })
  if (centre) nodes += `<circle cx="${C}" cy="${C}" r="44" fill="#fff" stroke="${D.color}" stroke-width="3"/><image href="${logo(ME)}" x="${C - 32}" y="${C - 32}" width="64" height="64"/>`
  sv.innerHTML = lines + nodes
}
draw('a', false); draw('b', true)
</script></body></html>
