const C = '#8F0A1E', INK = '#15181d'
const SIT = { RegularPlay: 'open play', FastBreak: 'counter', SetPiece: 'set piece', FromCorner: 'corner', FreeKick: 'free kick', Penalty: 'penalty', ThrowInSetPiece: 'throw-in' }
const col = s => s ? C : INK
// the half pitch, attacking up: 68 wide, 35 deep (goal at the top)
function pitch(list, c) {
  const pts = list.filter(s => s.x >= 70).map(s => { const X = s.y, Y = 105 - s.x, g = s.t === 'Goal'
    if (g) return `<circle cx="${X}" cy="${Y}" r="${(0.8 + Math.min(s.xg, .6) * 2).toFixed(2)}" fill="${c}" stroke="#fff" stroke-width=".35"><title>${s.min}' ${s.who} v ${s.opp} · xG ${s.xg.toFixed(2)} · ${SIT[s.sit] || s.sit} · ${s.body}</title></circle>`
    if (s.t === 'AttemptSaved' && s.onT) return `<circle cx="${X}" cy="${Y}" r=".55" fill="#fff" stroke="${c}" stroke-width=".3" opacity=".6"/>`
    return `<g stroke="#9aa0a8" stroke-width=".25" opacity=".55"><line x1="${X-.45}" y1="${Y-.45}" x2="${X+.45}" y2="${Y+.45}"/><line x1="${X-.45}" y1="${Y+.45}" x2="${X+.45}" y2="${Y-.45}"/></g>` }).join('')
  return `<svg viewBox="0 -1 68 36"><rect x="0" y="0" width="68" height="35" fill="#e8eee8" rx=".8"/><g fill="none" stroke="#fff" stroke-width=".4"><rect x="13.84" y="0" width="40.32" height="16.5"/><rect x="24.84" y="0" width="18.32" height="5.5"/><path d="M26.7 16.5a9.15 9.15 0 0 0 14.6 0"/></g><rect x="30.34" y="-1" width="7.32" height="1" fill="${INK}"/>${pts}</svg>` }
// the goal from the shooter's view: posts at 0 and 2, bar at .667, the ground at 0
function frame(list, c) {
  const W = 2, H = .6667, sx = 100 / W, pad = 8
  const pts = list.filter(s => s.gx != null && s.t === 'Goal' && !s.og).map(s => { const X = pad + s.gx * sx, Y = 6 + (H - s.gy) * sx
    return s.t === 'Goal' ? `<circle cx="${X}" cy="${Y}" r="3.2" fill="${c}" stroke="#fff" stroke-width="1"><title>${s.min}' ${s.who} v ${s.opp}</title></circle>` : `<circle cx="${X}" cy="${Y}" r="2.2" fill="#fff" stroke="${c}" stroke-width="1" opacity=".55"/>` }).join('')
  return `<svg viewBox="0 0 116 46"><defs><pattern id="n${c.slice(1)}" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 0H0V4" fill="none" stroke="#dfe3e6" stroke-width=".4"/></pattern></defs><rect x="${pad}" y="6" width="100" height="${H*sx}" fill="url(#n${c.slice(1)})"/><path d="M${pad} ${6+H*sx}V6H${pad+100}V${6+H*sx}" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/><line x1="0" x2="116" y1="${6+H*sx}" y2="${6+H*sx}" stroke="#c9ced4" stroke-width=".6"/>${pts}</svg>` }

const g = L => L.filter(s => s.t === 'Goal').length, xg = L => L.reduce((a, s) => a + (s.xg || 0), 0).toFixed(1)

document.getElementById('a').innerHTML = `<div>${head('Scored', F)}${frame(F, C)}${pitch(F, C)}</div><div>${head('Conceded', A)}${frame(A, INK)}${pitch(A, INK)}</div>`
document.getElementById('b').innerHTML = `<div class="row"><div>${head('Scored', F)}${pitch(F, C)}</div><div>${frame(F, C)}</div></div><div class="row"><div>${head('Conceded', A)}${pitch(A, INK)}</div><div>${frame(A, INK)}</div></div>`
