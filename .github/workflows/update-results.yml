name: Update results

# Pulls finished 2026/27 matches from football-data.org, commits any new results,
# and (only if something changed) rebuilds + redeploys GitHub Pages.
on:
  schedule:
    # Smart schedule keyed to when matches actually finish (all times UTC), with a buffer for the
    # football-data.org feed lag (a result can take 20–40 min after full-time to appear). Derived from
    # the fixture kickoff times in src/data/schedule-*.js: finished matches cluster into an afternoon
    # peak (~14:00–17:00 UTC, weekends) and an evening peak (~19:00–22:30 UTC, every day — late domestic
    # kickoffs + all UEFA midweek nights). Public repo → Actions minutes are free, and each run no-ops
    # (~40s, no deploy) when nothing changed, so we poll densely inside those windows and stay quiet outside.
    - cron: '0,30 18-22 * * *'     # every day 18:00–22:30 — evening window (late league games + UEFA Tue–Thu)
    - cron: '0 23 * * *'           # every day 23:00 — tail, catches ~22:xx finishers + feed lag
    - cron: '0,30 12-17 * * 0,6'   # Sat & Sun 12:00–17:30 — weekend afternoon window (early & mid kickoffs)
    - cron: '0 8 * * *'            # daily safety net — sweep up anything the feed posted overnight (late FT / corrections)
  workflow_dispatch: {}            # allow a manual run from the Actions tab

permissions:
  contents: write   # push the updated result files
  pages: write      # deploy
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false        # queue behind an in-flight Pages deploy rather than cancel it

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Fetch results (football-data.org)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-results.mjs --season 2026-27

      - name: Fetch highlights (YouTube Data API)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-highlights.mjs --season 2026-27 || true

      # UEFA club competitions (Champions/Europa/Conference League) — UEFA public API (football-data has
      # the seasons but no fixtures yet). Re-runs the generator per comp: rewrites the (stable) schedule
      # and fills in results as matches finish.
      - name: Fetch UEFA competitions (UEFA API)
        run: |
          node scripts/gen-uefa.mjs --comp CL  --season 2026-27 || true
          node scripts/gen-uefa.mjs --comp EL  --season 2026-27 || true
          node scripts/gen-uefa.mjs --comp ECL --season 2026-27 || true

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/results-*-2026-27.js src/data/highlights-*-2026-27.js src/data/schedule-CL-2026-27.js src/data/schedule-EL-2026-27.js src/data/schedule-ECL-2026-27.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new results — nothing to deploy."
          else
            git commit -m "Auto: update 2026/27 results"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # deploy (only when results actually changed)
      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: dist
      - name: Deploy
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
